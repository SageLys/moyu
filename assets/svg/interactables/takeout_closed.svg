<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="110" height="80">
  <!-- Box body -->
  <rect x="5" y="32" width="100" height="44" rx="4" fill="#D98E4F" stroke="#2C3E50" stroke-width="2.5"/>
  <!-- Box body side lines -->
  <line x1="5" y1="50" x2="105" y2="50" stroke="#B87840" stroke-width="1.5" opacity="0.6"/>
  <!-- Lid closed -->
  <rect x="5" y="12" width="100" height="24" rx="4" fill="#E8A870" stroke="#2C3E50" stroke-width="2.5"/>
  <!-- Lid-body joint line -->
  <line x1="5" y1="32" x2="105" y2="32" stroke="#2C3E50" stroke-width="2"/>
  <!-- Lid pull tab -->
  <rect x="40" y="5" width="30" height="12" rx="5" fill="#C07A38" stroke="#2C3E50" stroke-width="2"/>
  <!-- Logo placeholder block -->
  <rect x="28" y="56" width="54" height="14" rx="3" fill="#C07A38" opacity="0.45"/>
  <!-- Box bottom edge -->
  <rect x="10" y="72" width="90" height="4" rx="2" fill="#B87840" opacity="0.5"/>
</svg>
