<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" width="110" height="80">
  <!-- Box body (open) -->
  <rect x="5" y="32" width="100" height="44" rx="4" fill="#D98E4F" stroke="#2C3E50" stroke-width="2.5"/>
  <!-- Food contents inside box -->
  <rect x="10" y="36" width="90" height="34" rx="3" fill="#C8A068"/>
  <!-- Rice/noodle blobs -->
  <ellipse cx="28" cy="50" rx="14" ry="9" fill="#E8D4A8" stroke="#B89060" stroke-width="1.5"/>
  <ellipse cx="55" cy="48" rx="16" ry="10" fill="#D8C090" stroke="#B89060" stroke-width="1.5"/>
  <ellipse cx="82" cy="51" rx="12" ry="8" fill="#DCC888" stroke="#B89060" stroke-width="1.5"/>
  <!-- Veggie bits -->
  <ellipse cx="40" cy="59" rx="6" ry="3" fill="#7A9A5C"/>
  <ellipse cx="67" cy="58" rx="5" ry="3" fill="#7A9A5C"/>
  <ellipse cx="20" cy="60" rx="4" ry="2.5" fill="#C87A4A" opacity="0.8"/>
  <!-- Chopsticks sticking out -->
  <line x1="62" y1="36" x2="78" y2="8" stroke="#7A5030" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="36" x2="85" y2="8" stroke="#7A5030" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lid flipped open (hinged at back) -->
  <rect x="5" y="12" width="100" height="22" rx="4" fill="#E8A870" stroke="#2C3E50" stroke-width="2.5" transform="rotate(-35 55 32)"/>
  <!-- Lid-body hinge line -->
  <line x1="5" y1="32" x2="105" y2="32" stroke="#2C3E50" stroke-width="2"/>
</svg>
