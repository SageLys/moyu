<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 64" width="50" height="64">
  <!-- Steam lines -->
  <path d="M17,14 Q14,9 17,4" fill="none" stroke="#B0B8C0" stroke-width="2" stroke-linecap="round"/>
  <path d="M25,13 Q22,7 25,2" fill="none" stroke="#B0B8C0" stroke-width="2" stroke-linecap="round"/>
  <path d="M33,14 Q30,9 33,4" fill="none" stroke="#B0B8C0" stroke-width="2" stroke-linecap="round"/>
  <!-- Lid / top rim -->
  <ellipse cx="25" cy="18" rx="20" ry="5" fill="#C07A3A" stroke="#2C3E50" stroke-width="2.5"/>
  <!-- Cup body (tapered trapezoid) -->
  <path d="M7,18 L43,18 L39,58 L11,58 Z" fill="#8B5E3C" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Cup body highlight stripe -->
  <path d="M11,28 L39,28 L38,34 L12,34 Z" fill="#9E6E48" opacity="0.5"/>
  <!-- Handle -->
  <path d="M39,26 Q52,26 52,37 Q52,48 39,48" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
  <path d="M39,28 Q49,28 49,37 Q49,46 39,46" fill="none" stroke="#7A5030" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Coffee surface (visible through lid hole) -->
  <ellipse cx="25" cy="18" rx="14" ry="3.5" fill="#3A2010"/>
  <!-- Cup base -->
  <ellipse cx="25" cy="58" rx="15" ry="4" fill="#6A4028" stroke="#2C3E50" stroke-width="2"/>
</svg>
