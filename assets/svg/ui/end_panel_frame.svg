<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Drop shadow -->
  <rect x="6" y="6" width="594" height="394" rx="12" fill="#1A2228" opacity="0.45"/>
  <!-- Panel body -->
  <rect x="0" y="0" width="594" height="394" rx="12" fill="#2A3440" stroke="#3E5060" stroke-width="3"/>
  <!-- Inner border -->
  <rect x="6" y="6" width="582" height="382" rx="9" fill="none" stroke="#4A6070" stroke-width="1.5" opacity="0.6"/>

  <!-- Title area (top band) -->
  <rect x="0" y="0" width="594" height="64" rx="12" fill="#1E2C38"/>
  <rect x="0" y="48" width="594" height="16" fill="#1E2C38"/>
  <!-- Title placeholder block (code renders result type text) -->
  <rect x="160" y="18" width="274" height="28" rx="6" fill="#3A4A58" opacity="0.8"/>

  <!-- Result illustration area (center) -->
  <rect x="24" y="76" width="546" height="196" rx="8" fill="#1A2430" stroke="#3A4A58" stroke-width="1.5"/>
  <!-- Illustration placeholder cross-hatch indicator -->
  <line x1="24" y1="76" x2="570" y2="272" stroke="#2A3848" stroke-width="1.5" opacity="0.4"/>
  <line x1="570" y1="76" x2="24" y2="272" stroke="#2A3848" stroke-width="1.5" opacity="0.4"/>
  <!-- Image area label -->
  <rect x="220" y="158" width="160" height="30" rx="6" fill="#2E3E4C" opacity="0.8"/>

  <!-- Stats area -->
  <rect x="24" y="284" width="254" height="24" rx="5" fill="#1A2430" opacity="0.8"/>
  <rect x="286" y="284" width="284" height="24" rx="5" fill="#1A2430" opacity="0.8"/>
  <!-- Stat content blocks -->
  <rect x="32" y="290" width="80" height="12" rx="3" fill="#3A5060" opacity="0.7"/>
  <rect x="120" y="290" width="50" height="12" rx="3" fill="#5A7888" opacity="0.6"/>
  <rect x="294" y="290" width="80" height="12" rx="3" fill="#3A5060" opacity="0.7"/>
  <rect x="382" y="290" width="50" height="12" rx="3" fill="#5A7888" opacity="0.6"/>

  <!-- End text area -->
  <rect x="24" y="320" width="546" height="16" rx="4" fill="#3A4A58" opacity="0.5"/>
  <rect x="24" y="342" width="420" height="12" rx="3" fill="#2E3E4C" opacity="0.4"/>

  <!-- Restart button placeholder area (code puts button here) -->
  <rect x="216" y="364" width="162" height="22" rx="8" fill="#3E5A6A" stroke="#5A7888" stroke-width="1.5" opacity="0.7"/>
</svg>
