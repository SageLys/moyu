<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 96" width="256" height="96">
  <!-- HUD background (dark with red tint border) -->
  <rect x="0" y="0" width="256" height="96" rx="8" fill="#1E2430" stroke="#7A1A1A" stroke-width="3"/>
  <!-- Inner border (secondary red) -->
  <rect x="4" y="4" width="248" height="88" rx="6" fill="none" stroke="#5A1212" stroke-width="1" opacity="0.6"/>
  <!-- Warning icon (left side) -->
  <!-- Triangle warning -->
  <polygon points="24,72 44,36 64,72" fill="#7A1A1A" stroke="#AA2020" stroke-width="2"/>
  <text x="44" y="66" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FF4040" text-anchor="middle">!</text>
  <!-- Vertical divider -->
  <line x1="72" y1="10" x2="72" y2="86" stroke="#3A2028" stroke-width="1.5"/>
  <!-- Countdown area (large, prominent) -->
  <rect x="82" y="16" width="72" height="44" rx="6" fill="#2A1820" stroke="#5A2020" stroke-width="1.5"/>
  <!-- Countdown number placeholder (code renders actual number) -->
  <rect x="90" y="22" width="56" height="32" rx="4" fill="#3A2020" opacity="0.7"/>
  <!-- Hourglass icon hint -->
  <line x1="102" y1="28" x2="126" y2="46" stroke="#7A3030" stroke-width="2" stroke-linecap="round"/>
  <line x1="126" y1="28" x2="102" y2="46" stroke="#7A3030" stroke-width="2" stroke-linecap="round"/>
  <!-- Status text area (right side) -->
  <rect x="162" y="20" width="82" height="12" rx="3" fill="#3A2830" opacity="0.8"/>
  <rect x="162" y="38" width="70" height="10" rx="3" fill="#2E2030" opacity="0.6"/>
  <rect x="162" y="54" width="60" height="10" rx="3" fill="#2E2030" opacity="0.5"/>
  <!-- Pulsing dot indicator (top right) -->
  <circle cx="242" cy="14" r="6" fill="#AA2020" opacity="0.9"/>
  <circle cx="242" cy="14" r="9" fill="none" stroke="#AA2020" stroke-width="1.5" opacity="0.4"/>
  <!-- Bottom status strip -->
  <rect x="4" y="78" width="248" height="14" rx="4" fill="#3A1818" opacity="0.7"/>
</svg>
