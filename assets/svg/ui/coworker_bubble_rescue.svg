<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <!-- Bubble circle background -->
  <circle cx="35" cy="35" r="32" fill="#6A3A3A" stroke="#2C3E50" stroke-width="2.5"/>
  <circle cx="35" cy="35" r="28" fill="none" stroke="#8A5A5A" stroke-width="1" opacity="0.5"/>
  <!-- Raised hand icon (求救 - help/rescue) -->
  <!-- Hand palm -->
  <rect x="26" y="30" width="18" height="22" rx="6" fill="#D4A07A" stroke="#2C3E50" stroke-width="2"/>
  <!-- Fingers -->
  <rect x="26" y="18" width="5" height="16" rx="3" fill="#D4A07A" stroke="#2C3E50" stroke-width="1.5"/>
  <rect x="32" y="15" width="5" height="18" rx="3" fill="#D4A07A" stroke="#2C3E50" stroke-width="1.5"/>
  <rect x="38" y="17" width="5" height="16" rx="3" fill="#D4A07A" stroke="#2C3E50" stroke-width="1.5"/>
  <!-- SOS text hint (small) -->
  <text x="35" y="57" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FF8080" text-anchor="middle" opacity="0.9">SOS</text>
  <!-- Exclamation above hand -->
  <circle cx="50" cy="20" r="7" fill="#C04040"/>
  <text x="50" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">!</text>
</svg>
