<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full object red tint overlay (semi-transparent) -->
  <rect x="0" y="0" width="100" height="100" rx="6" fill="#FF3B30" opacity="0.55"/>
  <!-- Brighter center flash -->
  <rect x="10" y="10" width="80" height="80" rx="4" fill="#FF6050" opacity="0.3"/>
  <!-- Red border flash -->
  <rect x="1" y="1" width="98" height="98" rx="7" fill="none"
        stroke="#FF3B30" stroke-width="5" filter="url(#red-glow)" opacity="0.9"/>
  <!-- X mark in center (wrong/invalid indicator) -->
  <line x1="32" y1="32" x2="68" y2="68" stroke="white" stroke-width="5"
        stroke-linecap="round" opacity="0.8"/>
  <line x1="68" y1="32" x2="32" y2="68" stroke="white" stroke-width="5"
        stroke-linecap="round" opacity="0.8"/>
</svg>
