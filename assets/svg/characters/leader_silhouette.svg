<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 230" width="130" height="230">
  <!-- Outer shadow/pressure aura -->
  <ellipse cx="65" cy="200" rx="54" ry="16" fill="#1A1C24" opacity="0.35"/>
  <!-- Red pressure glow at base -->
  <ellipse cx="65" cy="210" rx="48" ry="10" fill="#7A1A1A" opacity="0.25"/>
  <!-- Suit body (broad, imposing) -->
  <path d="M14,106 Q4,112 4,148 L6,222 L124,222 L126,148 Q126,112 116,106 Z" fill="#1E2230" stroke="#12141C" stroke-width="2"/>
  <!-- Suit lapels (darker shape) -->
  <path d="M52,106 L65,128 L78,106" fill="#14161E" stroke="#12141C" stroke-width="1.5"/>
  <!-- Tie (very dark, slightly visible) -->
  <path d="M65,128 L60,170 L65,178 L70,170 Z" fill="#1A0808" opacity="0.8"/>
  <!-- Suit collar/shoulders (broad) -->
  <path d="M14,106 Q28,98 52,106" fill="#1E2230" stroke="#12141C" stroke-width="1.5"/>
  <path d="M78,106 Q102,98 116,106" fill="#1E2230" stroke="#12141C" stroke-width="1.5"/>
  <!-- Neck (dark, featureless) -->
  <rect x="56" y="88" width="18" height="22" rx="5" fill="#1E2230" stroke="#12141C" stroke-width="1.5"/>
  <!-- Head silhouette (large, featureless darkness) -->
  <ellipse cx="65" cy="64" rx="40" ry="44" fill="#1A1C24" stroke="#12141C" stroke-width="2"/>
  <!-- Hair silhouette (adds to imposing outline) -->
  <ellipse cx="65" cy="38" rx="40" ry="22" fill="#12141C" stroke="#12141C" stroke-width="1.5"/>
  <!-- NO face features - pure shadow/darkness -->
  <!-- Subtle red glint where eyes would be (menacing, not cute) -->
  <ellipse cx="53" cy="64" rx="7" ry="4" fill="#3A0808" opacity="0.6"/>
  <ellipse cx="77" cy="64" rx="7" ry="4" fill="#3A0808" opacity="0.6"/>
  <!-- Left arm (rigid, formal) -->
  <rect x="0" y="108" width="18" height="90" rx="8" fill="#1A1C24" stroke="#12141C" stroke-width="1.5"/>
  <!-- Left hand (clenched at side) -->
  <ellipse cx="8" cy="196" rx="10" ry="8" fill="#16181F" stroke="#12141C" stroke-width="1.5"/>
  <!-- Right arm (holding clipboard/document - power prop) -->
  <rect x="112" y="108" width="18" height="90" rx="8" fill="#1A1C24" stroke="#12141C" stroke-width="1.5"/>
  <!-- Clipboard/document (authority prop) -->
  <rect x="108" y="148" width="24" height="32" rx="3" fill="#2A2C34" stroke="#3A3C44" stroke-width="1.5"/>
  <rect x="111" y="152" width="18" height="3" rx="1" fill="#3A3C44" opacity="0.6"/>
  <rect x="111" y="158" width="18" height="3" rx="1" fill="#3A3C44" opacity="0.5"/>
  <rect x="111" y="164" width="12" height="3" rx="1" fill="#3A3C44" opacity="0.4"/>
  <!-- Subtle red edge vignette (pressure aura) -->
  <ellipse cx="65" cy="130" rx="66" ry="115" fill="none" stroke="#6A1010" stroke-width="3" opacity="0.2"/>
</svg>
