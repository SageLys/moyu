<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Radial gradient: dark at edges, transparent at center -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="40%" stop-color="#1A0808" stop-opacity="0"/>
      <stop offset="70%" stop-color="#1A0808" stop-opacity="0.35"/>
      <stop offset="85%" stop-color="#2A0808" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#380A0A" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
  <!-- Full-screen vignette overlay -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#vignette)"/>
  <!-- Edge border reinforcement (top) -->
  <rect x="0" y="0" width="1280" height="60" fill="#1A0808" opacity="0.3"/>
  <!-- Edge border reinforcement (bottom) -->
  <rect x="0" y="660" width="1280" height="60" fill="#1A0808" opacity="0.3"/>
  <!-- Edge border reinforcement (left) -->
  <rect x="0" y="0" width="80" height="720" fill="#1A0808" opacity="0.25"/>
  <!-- Edge border reinforcement (right) -->
  <rect x="1200" y="0" width="80" height="720" fill="#1A0808" opacity="0.25"/>
  <!-- Thin red warning border at very edge -->
  <rect x="0" y="0" width="1280" height="720" fill="none"
        stroke="#7A1010" stroke-width="6" opacity="0.6"/>
  <!-- Corner accent marks (top-left) -->
  <path d="M0,60 L0,0 L80,0" fill="none" stroke="#AA1818" stroke-width="4" opacity="0.7"/>
  <!-- Corner accent (top-right) -->
  <path d="M1200,0 L1280,0 L1280,60" fill="none" stroke="#AA1818" stroke-width="4" opacity="0.7"/>
  <!-- Corner accent (bottom-left) -->
  <path d="M0,660 L0,720 L80,720" fill="none" stroke="#AA1818" stroke-width="4" opacity="0.7"/>
  <!-- Corner accent (bottom-right) -->
  <path d="M1200,720 L1280,720 L1280,660" fill="none" stroke="#AA1818" stroke-width="4" opacity="0.7"/>
</svg>
