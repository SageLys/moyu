<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220" width="140" height="220">
  <!-- Hair (back) -->
  <ellipse cx="72" cy="44" rx="34" ry="22" fill="#2A3020" stroke="#2C3E50" stroke-width="2.5"/>
  <ellipse cx="40" cy="56" rx="12" ry="17" fill="#2A3020" stroke="#2C3E50" stroke-width="2"/>
  <ellipse cx="104" cy="54" rx="11" ry="15" fill="#2A3020" stroke="#2C3E50" stroke-width="2"/>
  <!-- Head (turned right, slightly angled) -->
  <ellipse cx="72" cy="66" rx="32" ry="36" fill="#C8A882" stroke="#2C3E50" stroke-width="3" transform="rotate(-12 72 66)"/>
  <!-- Hair front -->
  <ellipse cx="72" cy="42" rx="32" ry="18" fill="#2A3020" stroke="#2C3E50" stroke-width="2"/>
  <!-- Eyes (both looking hard right toward corridor) -->
  <ellipse cx="60" cy="64" rx="6" ry="7" fill="white" stroke="#2C3E50" stroke-width="1.5"/>
  <ellipse cx="63" cy="64" rx="4" ry="5" fill="#1A1810"/>
  <ellipse cx="82" cy="62" rx="6" ry="7" fill="white" stroke="#2C3E50" stroke-width="1.5"/>
  <ellipse cx="85" cy="62" rx="4" ry="5" fill="#1A1810"/>
  <!-- Eyebrows (raised, alert/watchful) -->
  <path d="M53,53 Q60,49 67,52" fill="none" stroke="#2A3020" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M75,51 Q82,47 89,50" fill="none" stroke="#2A3020" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Mouth (tense/serious) -->
  <path d="M63,82 Q72,82 80,82" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="65" y="98" width="12" height="14" rx="4" fill="#C8A882" stroke="#2C3E50" stroke-width="2"/>
  <!-- Body/shirt (seated, mostly forward) -->
  <path d="M32,110 Q26,114 24,142 L26,192 L114,192 L116,142 Q114,114 108,110 Z" fill="#8A9AA0" stroke="#2C3E50" stroke-width="3"/>
  <!-- Left arm (hanging normal) -->
  <rect x="10" y="112" width="20" height="64" rx="10" fill="#8A9AA0" stroke="#2C3E50" stroke-width="2.5" transform="rotate(12 20 144)"/>
  <ellipse cx="10" cy="174" rx="11" ry="9" fill="#C8A882" stroke="#2C3E50" stroke-width="2"/>
  <!-- Right arm raised (peering/shielding gesture) -->
  <rect x="108" y="108" width="20" height="56" rx="10" fill="#8A9AA0" stroke="#2C3E50" stroke-width="2.5" transform="rotate(-70 118 136)"/>
  <!-- Hand near brow (peering) -->
  <ellipse cx="118" cy="88" rx="13" ry="10" fill="#C8A882" stroke="#2C3E50" stroke-width="2"/>
  <!-- Seated lower body -->
  <rect x="32" y="188" width="76" height="28" rx="8" fill="#4A5C6A" stroke="#2C3E50" stroke-width="2.5"/>
  <!-- "Looking toward" directional indicator (subtle arrow lines) -->
  <line x1="120" y1="75" x2="134" y2="68" stroke="#8A9AA0" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <line x1="120" y1="82" x2="136" y2="78" stroke="#8A9AA0" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
</svg>
