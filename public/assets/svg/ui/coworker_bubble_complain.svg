<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <!-- Bubble circle background -->
  <circle cx="35" cy="35" r="32" fill="#4A4A2A" stroke="#2C3E50" stroke-width="2.5"/>
  <circle cx="35" cy="35" r="28" fill="none" stroke="#6A6A4A" stroke-width="1" opacity="0.5"/>
  <!-- Speech bubble shape (吐槽 - complain/rant) -->
  <rect x="14" y="16" width="42" height="30" rx="8" fill="#D8D040" stroke="#2C3E50" stroke-width="2"/>
  <!-- Speech bubble tail (pointing down-left) -->
  <polygon points="20,44 14,56 30,44" fill="#D8D040" stroke="#2C3E50" stroke-width="2"/>
  <!-- Angry lightning bolt inside bubble -->
  <path d="M31,20 L25,30 L33,30 L27,42 L39,28 L31,28 Z" fill="#8A6A10" stroke="#2C3E50" stroke-width="1.5"/>
  <!-- Frustrated marks -->
  <line x1="40" y1="20" x2="44" y2="24" stroke="#8A6A10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="20" x2="40" y2="24" stroke="#8A6A10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="30" x2="46" y2="34" stroke="#8A6A10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="30" x2="42" y2="34" stroke="#8A6A10" stroke-width="2.5" stroke-linecap="round"/>
</svg>
