<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 20" width="300" height="20">
  <!-- Bar track -->
  <rect x="0" y="0" width="300" height="20" rx="9" fill="#1A2228" stroke="#3A4A58" stroke-width="2"/>
  <!-- Fill at ~85% (trust resource - soft green) -->
  <rect x="2" y="2" width="251" height="16" rx="7" fill="#7A9E7A"/>
  <!-- Top highlight -->
  <rect x="2" y="2" width="251" height="6" rx="7" fill="#9AB89A" opacity="0.45"/>
  <!-- Tick marks -->
  <line x1="75" y1="2" x2="75" y2="18" stroke="#1A2228" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="2" x2="150" y2="18" stroke="#1A2228" stroke-width="1" opacity="0.5"/>
  <line x1="225" y1="2" x2="225" y2="18" stroke="#1A2228" stroke-width="1.5" opacity="0.7"/>
</svg>
